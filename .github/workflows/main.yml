name: Upload Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Sync website to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: >-
          aws s3 sync . "s3://${AWS_S3_BUCKET}"
          --acl public-read
          --follow-symlinks
          --exclude '.git/*'
          --exclude '.github/*'
          --exclude 'LICENSE'
          --exclude 'README.md'
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_CLOUDFRONT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_CLOUDFRONT }}
        run: aws cloudfront create-invalidation --region us-east-1 --distribution-id "$DISTRIBUTION" --paths '/*'
